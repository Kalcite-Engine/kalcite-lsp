[package]
name = "kalcite-lsp"
version = "0.14.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Language Server Protocol implementation for the Kalcite language"
repository = "https://github.com/Kalcite-Engine/kalcite-lsp"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
kalcite-compiler = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-syntax = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-project = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-scene = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-assets = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-input = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-save = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
